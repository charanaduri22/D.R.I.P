<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRIP — Disaster Relocation Intelligence Platform</title>
  <meta name="description" content="Cyberpunk HUD command terminal for disaster relocation decision support. Analyzes hazard intensity, population vulnerability, and recommends relocation zones." />

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS 3 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Fira Code Monospace Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Fira Code"', 'Courier New', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #000; font-family: 'Fira Code', 'Courier New', monospace; overflow: hidden; }

    /* ── Scanline overlay ── */
    .scanlines::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 255, 0.015) 2px,
        rgba(0, 255, 255, 0.015) 4px
      );
    }

    /* ── Blinking cursor ── */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink { animation: blink 1s step-end infinite; }

    /* ── Glow pulse on selected row ── */
    @keyframes glowPulse {
      0%, 100% { box-shadow: inset 0 0 8px rgba(0, 255, 255, 0.1); }
      50% { box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.25); }
    }
    .glow-pulse { animation: glowPulse 2s ease-in-out infinite; }

    /* ── HUD bracket corners ── */
    .hud-panel { position: relative; }
    .hud-panel::before,
    .hud-panel::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .hud-panel::before {
      top: -1px; left: -1px;
      border-top: 2px solid #22d3ee;
      border-left: 2px solid #22d3ee;
    }
    .hud-panel::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid #22d3ee;
      border-right: 2px solid #22d3ee;
    }
    .hud-corners { position: relative; }
    .hud-corners .corner-tr,
    .hud-corners .corner-bl {
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .hud-corners .corner-tr {
      top: -1px; right: -1px;
      border-top: 2px solid #22d3ee;
      border-right: 2px solid #22d3ee;
    }
    .hud-corners .corner-bl {
      bottom: -1px; left: -1px;
      border-bottom: 2px solid #22d3ee;
      border-left: 2px solid #22d3ee;
    }

    /* ── Execute button glow ── */
    .execute-btn {
      transition: all 0.2s ease;
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.4);
    }
    .execute-btn:hover {
      background: #22d3ee !important;
      color: #000 !important;
      text-shadow: none;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), 0 0 60px rgba(0, 255, 255, 0.3);
    }

    /* ── Subtle flicker ── */
    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.6; }
      97% { opacity: 1; }
      98% { opacity: 0.4; }
      99% { opacity: 1; }
    }
    .flicker { animation: flicker 5s infinite; }

    /* ── Custom scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #164e63; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #22d3ee; }

    /* ── Donut ring animation ── */
    @keyframes donutDraw { from { stroke-dashoffset: 251.2; } }
    .donut-animate { animation: donutDraw 1.2s ease-out forwards; }

    /* ═══════════════════════════════════════
       LEAFLET OVERRIDES — Dark cyberpunk style
       ═══════════════════════════════════════ */
    .leaflet-container {
      background: #000 !important;
      font-family: 'Fira Code', monospace !important;
    }
    .leaflet-control-zoom {
      border: 1px solid rgba(34,211,238,0.3) !important;
      background: rgba(0,0,0,0.85) !important;
    }
    .leaflet-control-zoom a {
      background: rgba(0,0,0,0.9) !important;
      color: #22d3ee !important;
      border-bottom-color: rgba(34,211,238,0.2) !important;
      font-family: 'Fira Code', monospace !important;
    }
    .leaflet-control-zoom a:hover {
      background: rgba(34,211,238,0.15) !important;
      color: #67e8f9 !important;
    }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.7) !important;
      color: #164e63 !important;
      font-size: 8px !important;
      font-family: 'Fira Code', monospace !important;
    }
    .leaflet-control-attribution a { color: #0e7490 !important; }
    .leaflet-popup-content-wrapper {
      background: rgba(0,0,0,0.92) !important;
      border: 1px solid rgba(34,211,238,0.5) !important;
      border-radius: 0 !important;
      box-shadow: 0 0 20px rgba(34,211,238,0.15) !important;
      font-family: 'Fira Code', monospace !important;
    }
    .leaflet-popup-tip { background: rgba(0,0,0,0.92) !important; border: 1px solid rgba(34,211,238,0.3) !important; }
    .leaflet-popup-close-button { color: #ef4444 !important; font-size: 16px !important; }

    /* ── Glowing map markers ── */
    @keyframes markerPulseRed {
      0%, 100% { box-shadow: 0 0 6px 2px rgba(239,68,68,0.5), 0 0 16px 4px rgba(239,68,68,0.2); }
      50% { box-shadow: 0 0 10px 4px rgba(239,68,68,0.7), 0 0 28px 8px rgba(239,68,68,0.3); }
    }
    @keyframes markerPulseCyan {
      0%, 100% { box-shadow: 0 0 6px 2px rgba(34,211,238,0.5), 0 0 16px 4px rgba(34,211,238,0.2); }
      50% { box-shadow: 0 0 10px 4px rgba(34,211,238,0.7), 0 0 28px 8px rgba(34,211,238,0.3); }
    }
    .marker-critical {
      width: 14px; height: 14px;
      background: #ef4444;
      border: 2px solid #fca5a5;
      border-radius: 50%;
      animation: markerPulseRed 2s ease-in-out infinite;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .marker-critical:hover { transform: scale(1.4); }
    .marker-critical.selected {
      width: 18px; height: 18px;
      border: 3px solid #fff;
      transform: scale(1.3);
    }
    .marker-high {
      width: 14px; height: 14px;
      background: #22d3ee;
      border: 2px solid #a5f3fc;
      border-radius: 50%;
      animation: markerPulseCyan 2s ease-in-out infinite;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .marker-high:hover { transform: scale(1.4); }
    .marker-high.selected {
      width: 18px; height: 18px;
      border: 3px solid #fff;
      transform: scale(1.3);
    }

    /* ── Marker ring (outer pulse ring) ── */
    @keyframes ringExpand {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(3); opacity: 0; }
    }
    .marker-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 14px; height: 14px;
      margin-top: -7px; margin-left: -7px;
      border-radius: 50%;
      border: 1px solid;
      animation: ringExpand 2s ease-out infinite;
      pointer-events: none;
    }
    .marker-ring.red { border-color: #ef4444; }
    .marker-ring.cyan { border-color: #22d3ee; }
  </style>
</head>
<body class="scanlines">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    /* ═══════════════════════════════════════
       MOCK DATA — with coordinates in the Uttarakhand / Garhwal Himalaya region
       ═══════════════════════════════════════ */
    const HABITATIONS = [
      { id: 1, name: 'Sector 4 — Slope A',    risk: 'CRITICAL', score: 89.7, pop: 2340, threatVector: 'LANDSLIDE', lat: 30.3465, lng: 78.0620 },
      { id: 2, name: 'Village Alpha',          risk: 'HIGH',     score: 76.2, pop: 1120, threatVector: 'FLOOD',     lat: 30.2850, lng: 77.9930 },
      { id: 3, name: 'Valley Settlement 09',   risk: 'CRITICAL', score: 93.1, pop: 4510, threatVector: 'SEISMIC',   lat: 30.3780, lng: 78.1150 },
      { id: 4, name: 'East Ridge — Block C',   risk: 'HIGH',     score: 68.4, pop: 890,  threatVector: 'EROSION',   lat: 30.3100, lng: 78.0800 },
    ];

    const MAP_CENTER = [30.3165, 78.0322];
    const MAP_ZOOM = 12;

    /* ═══════════════════════════════════════
       WINDOW CONTROLS
       ═══════════════════════════════════════ */
    function WindowControls() {
      return (
        <div className="flex items-center gap-1.5 select-none" aria-hidden="true">
          <span className="text-cyan-600 text-xs font-bold cursor-default hover:text-cyan-300 transition-colors">_</span>
          <span className="text-cyan-600 text-xs font-bold cursor-default hover:text-cyan-300 transition-colors">[]</span>
          <span className="text-red-600 text-xs font-bold cursor-default hover:text-red-400 transition-colors">X</span>
        </div>
      );
    }

    /* ═══════════════════════════════════════
       STATUS BAR
       ═══════════════════════════════════════ */
    function StatusBar() {
      const [time, setTime] = useState(new Date());
      useEffect(() => {
        const t = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(t);
      }, []);

      const fmt = (n) => String(n).padStart(2, '0');
      const ts = `${fmt(time.getHours())}:${fmt(time.getMinutes())}:${fmt(time.getSeconds())}`;

      return (
        <header className="flex items-center justify-between px-4 py-2 border-b border-cyan-900/60 bg-cyan-950/20 select-none">
          <div className="flex items-center gap-3">
            <span className="text-cyan-400 text-[10px] tracking-[0.3em] uppercase">◆ DRIP_SYS</span>
            <span className="text-cyan-700 text-[10px]">|</span>
            <span className="text-cyan-600 text-[10px] tracking-wider">DISASTER RELOCATION INTELLIGENCE PLATFORM</span>
          </div>
          <div className="flex items-center gap-4">
            <span className="text-cyan-500 text-[10px] tracking-widest font-light">{ts} IST</span>
            <span className="text-cyan-700 text-[10px]">|</span>
            <span className="text-green-500 text-[10px] tracking-wider">● ONLINE</span>
            <WindowControls />
          </div>
        </header>
      );
    }

    /* ═══════════════════════════════════════
       LEAFLET MAP PANEL (Left — 60%)
       Uses Leaflet directly via useRef/useEffect
       ═══════════════════════════════════════ */
    function MapPanel({ habitations, selectedId, onSelectHabitation, flyToTarget }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef({});

      // Initialize the Leaflet map once
      useEffect(() => {
        if (mapInstanceRef.current) return; // already initialized

        const map = L.map(mapContainerRef.current, {
          center: MAP_CENTER,
          zoom: MAP_ZOOM,
          zoomControl: true,
          attributionControl: true,
        });

        // CartoDB Dark Matter tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 19,
        }).addTo(map);

        mapInstanceRef.current = map;

        // Force a resize after a tick so tiles render correctly
        setTimeout(() => map.invalidateSize(), 100);

        return () => {
          map.remove();
          mapInstanceRef.current = null;
        };
      }, []);

      // Sync markers whenever habitations change
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        // Remove old markers
        Object.values(markersRef.current).forEach(m => map.removeLayer(m));
        markersRef.current = {};

        habitations.forEach(hab => {
          const isCritical = hab.risk === 'CRITICAL';
          const isSelected = hab.id === selectedId;
          const baseClass = isCritical ? 'marker-critical' : 'marker-high';
          const ringClass = isCritical ? 'red' : 'cyan';
          const size = isSelected ? 18 : 14;

          const icon = L.divIcon({
            className: '',
            html: `
              <div style="position:relative;width:${size}px;height:${size}px;">
                <div class="${baseClass} ${isSelected ? 'selected' : ''}" style="width:${size}px;height:${size}px;"></div>
                <div class="marker-ring ${ringClass}"></div>
              </div>
            `,
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2],
          });

          const popupContent = `
            <div style="font-family:'Fira Code',monospace;padding:4px;">
              <div style="color:#22d3ee;font-size:9px;letter-spacing:0.15em;margin-bottom:4px;">TARGET_HABITATION</div>
              <div style="color:#a5f3fc;font-size:12px;font-weight:600;margin-bottom:6px;">${hab.name}</div>
              <div style="display:flex;gap:12px;font-size:9px;">
                <span style="color:${isCritical ? '#ef4444' : '#fbbf24'};">${hab.risk}</span>
                <span style="color:#0e7490;">SCORE: ${hab.score}%</span>
              </div>
              <div style="font-size:9px;color:#164e63;margin-top:4px;">
                POP: ${hab.pop.toLocaleString()} | VECTOR: ${hab.threatVector}
              </div>
            </div>
          `;

          const marker = L.marker([hab.lat, hab.lng], { icon })
            .bindPopup(popupContent, { closeButton: true, minWidth: 180 })
            .addTo(map);

          marker.on('click', () => {
            onSelectHabitation(hab.id);
          });

          markersRef.current[hab.id] = marker;
        });
      }, [habitations, selectedId, onSelectHabitation]);

      // Fly to target when triggered from the right panel
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map || !flyToTarget) return;

        map.flyTo([flyToTarget.lat, flyToTarget.lng], 14, {
          duration: 1.2,
          easeLinearity: 0.25,
        });

        // Open the popup for this marker
        const marker = markersRef.current[flyToTarget.id];
        if (marker) {
          setTimeout(() => marker.openPopup(), 800);
        }
      }, [flyToTarget]);

      return (
        <div className="h-full border border-cyan-800/50 hud-panel hud-corners flex flex-col bg-black relative overflow-hidden">
          <span className="corner-tr"></span>
          <span className="corner-bl"></span>

          {/* Panel header */}
          <div className="flex items-center justify-between px-3 py-1.5 border-b border-cyan-900/40 z-[500] relative">
            <span className="text-cyan-600 text-[10px] tracking-[0.2em] uppercase">MAP_INTERFACE // LEAFLET_ACTIVE</span>
            <WindowControls />
          </div>

          {/* Map container */}
          <div className="flex-1 relative">
            <div ref={mapContainerRef} className="absolute inset-0" style={{ zIndex: 1 }}></div>

            {/* HUD overlay — top-left coordinates */}
            <div className="absolute top-2 left-2 z-[400] pointer-events-none space-y-1">
              <div className="bg-black/70 border border-cyan-900/40 px-2 py-1">
                <span className="text-cyan-700 text-[8px] tracking-wider">CENTER: 30.3165°N, 78.0322°E</span>
              </div>
            </div>

            {/* HUD overlay — top-right info */}
            <div className="absolute top-2 right-12 z-[400] pointer-events-none">
              <div className="bg-black/70 border border-cyan-900/40 px-2 py-1">
                <span className="text-cyan-700 text-[8px] tracking-wider">REGION: GARHWAL_HIMALAYA</span>
              </div>
            </div>

            {/* HUD overlay — bottom bar */}
            <div className="absolute bottom-0 left-0 right-0 z-[400] pointer-events-none">
              <div className="flex items-center justify-between px-3 py-1 bg-black/70 border-t border-cyan-900/40 text-[8px] text-cyan-800 tracking-wider">
                <span>TILES: CARTO_DARK_MATTER</span>
                <div className="flex items-center gap-3">
                  <span className="flex items-center gap-1">
                    <span className="inline-block w-2 h-2 rounded-full bg-red-500" style={{boxShadow:'0 0 4px #ef4444'}}></span>
                    CRITICAL
                  </span>
                  <span className="flex items-center gap-1">
                    <span className="inline-block w-2 h-2 rounded-full bg-cyan-400" style={{boxShadow:'0 0 4px #22d3ee'}}></span>
                    HIGH
                  </span>
                </div>
                <span>MARKERS: {habitations.length} ACTIVE</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════
       DONUT RING SVG
       ═══════════════════════════════════════ */
    function DonutChart({ score }) {
      const radius = 40;
      const circumference = 2 * Math.PI * radius;
      const filled = (score / 100) * circumference;
      const remaining = circumference - filled;
      const isCritical = score >= 85;

      return (
        <svg width="110" height="110" viewBox="0 0 110 110" className="drop-shadow-lg">
          <circle cx="55" cy="55" r="52" fill="none" stroke="rgba(0,255,255,0.06)" strokeWidth="1" />
          <circle cx="55" cy="55" r={radius} fill="none" stroke="rgba(0,255,255,0.1)" strokeWidth="8" />
          <circle
            cx="55" cy="55" r={radius}
            fill="none"
            stroke={isCritical ? '#ef4444' : '#22d3ee'}
            strokeWidth="8"
            strokeDasharray={`${filled} ${remaining}`}
            strokeDashoffset={circumference * 0.25}
            strokeLinecap="round"
            className="donut-animate"
            style={{ filter: `drop-shadow(0 0 6px ${isCritical ? 'rgba(239,68,68,0.5)' : 'rgba(34,211,238,0.5)'})` }}
          />
          <text x="55" y="51" textAnchor="middle" className="fill-cyan-300 text-sm" style={{ fontFamily: "'Fira Code', monospace", fontSize: '14px', fontWeight: 600 }}>
            {score}%
          </text>
          <text x="55" y="67" textAnchor="middle" className="fill-cyan-700" style={{ fontFamily: "'Fira Code', monospace", fontSize: '8px' }}>
            RISK
          </text>
        </svg>
      );
    }

    /* ═══════════════════════════════════════
       HABITATION ROW
       ═══════════════════════════════════════ */
    function HabitationRow({ hab, isSelected, onAnalyze, onRemove }) {
      const isCritical = hab.risk === 'CRITICAL';

      return (
        <div
          className={`
            flex items-center justify-between px-3 py-2.5 border border-transparent transition-all duration-300 group cursor-pointer
            ${isSelected
              ? 'bg-cyan-900/40 border-cyan-500/40 glow-pulse'
              : 'hover:bg-cyan-950/30 hover:border-cyan-800/30'
            }
          `}
          onClick={() => onAnalyze(hab)}
        >
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <span className={`text-[9px] px-1.5 py-0.5 border font-semibold tracking-wider ${
                isCritical
                  ? 'text-red-400 border-red-500/50 bg-red-950/30'
                  : 'text-amber-400 border-amber-500/50 bg-amber-950/30'
              }`}>
                {hab.risk}
              </span>
              <span className="text-cyan-300 text-xs truncate tracking-wide">{hab.name}</span>
            </div>
            <div className="flex items-center gap-3 mt-1">
              <span className="text-cyan-700 text-[9px] tracking-wider">POP: {hab.pop.toLocaleString()}</span>
              <span className="text-cyan-800 text-[9px]">|</span>
              <span className="text-cyan-700 text-[9px] tracking-wider">THREAT: {hab.threatVector}</span>
            </div>
          </div>

          <div className="flex items-center gap-2 ml-3 shrink-0">
            <button
              onClick={(e) => { e.stopPropagation(); onAnalyze(hab); }}
              className={`text-[10px] tracking-wider px-2 py-1 border transition-all duration-200 ${
                isSelected
                  ? 'text-black bg-cyan-400 border-cyan-400'
                  : 'text-cyan-400 border-cyan-700/50 hover:border-cyan-400 hover:bg-cyan-950/50'
              }`}
            >
              [ ANALYZE ]
            </button>
            <button
              onClick={(e) => { e.stopPropagation(); onRemove(hab.id); }}
              className="text-[10px] tracking-wider px-2 py-1 border text-red-500 border-red-800/50 hover:border-red-500 hover:bg-red-950/50 transition-all duration-200"
            >
              [ X ]
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════
       COMMAND TERMINAL (Right — 40%)
       ═══════════════════════════════════════ */
    function CommandTerminal({ habitations, selectedId, selected, onAnalyze, onRemove }) {
      const [executed, setExecuted] = useState(false);

      const handleExecute = () => {
        setExecuted(true);
        setTimeout(() => setExecuted(false), 2000);
      };

      return (
        <div className="h-full flex flex-col border border-cyan-800/50 hud-panel hud-corners bg-black overflow-hidden">
          <span className="corner-tr"></span>
          <span className="corner-bl"></span>

          {/* Panel header bar */}
          <div className="flex items-center justify-between px-3 py-1.5 border-b border-cyan-900/40">
            <span className="text-cyan-600 text-[10px] tracking-[0.2em] uppercase">COMMAND_TERMINAL</span>
            <WindowControls />
          </div>

          {/* Scrollable content */}
          <div className="flex-1 overflow-y-auto px-4 py-3 space-y-4">

            {/* Header */}
            <div>
              <div className="text-cyan-600 text-[10px] tracking-[0.2em] mb-1">
                &gt;&gt; RELOCATION_PROTOCOL_V1.0
              </div>
              <h1 className="text-cyan-300 text-lg font-bold tracking-wider leading-tight">
                CRITICAL ZONES DETECTED<span className="cursor-blink text-cyan-400">_</span>
              </h1>
              <div className="text-cyan-800 text-[9px] tracking-wider mt-1">
                {habitations.length} HABITATION{habitations.length !== 1 ? 'S' : ''} FLAGGED FOR RELOCATION ANALYSIS
              </div>
            </div>

            {/* Habitations List */}
            <div className="border border-cyan-800/40 hud-panel hud-corners relative">
              <span className="corner-tr"></span>
              <span className="corner-bl"></span>

              <div className="flex items-center justify-between px-3 py-1.5 border-b border-cyan-900/40">
                <span className="text-cyan-700 text-[9px] tracking-[0.2em]">HABITATION_REGISTRY</span>
                <span className="text-cyan-800 text-[9px]">{habitations.length} ENTRIES</span>
              </div>

              <div className="divide-y divide-cyan-900/20">
                {habitations.length > 0 ? (
                  habitations.map(hab => (
                    <HabitationRow
                      key={hab.id}
                      hab={hab}
                      isSelected={selectedId === hab.id}
                      onAnalyze={onAnalyze}
                      onRemove={onRemove}
                    />
                  ))
                ) : (
                  <div className="px-3 py-6 text-center text-cyan-800 text-xs tracking-wider">
                    NO HABITATIONS IN REGISTRY
                  </div>
                )}
              </div>
            </div>

            {/* Execute Action */}
            <div>
              <div className="text-cyan-500 text-[10px] tracking-[0.2em] mb-2">
                INITIATE OVERRIDE?
              </div>
              <button
                onClick={handleExecute}
                disabled={!selected}
                className={`execute-btn w-full py-3 border-2 text-sm font-bold tracking-[0.3em] uppercase transition-all duration-200
                  ${selected
                    ? 'border-cyan-500 text-cyan-400 bg-cyan-950/20 hover:bg-cyan-400 hover:text-black'
                    : 'border-cyan-900/40 text-cyan-800 bg-transparent cursor-not-allowed'
                  }
                  ${executed ? 'bg-cyan-400 !text-black border-cyan-300' : ''}
                `}
              >
                {executed ? '>> PROTOCOL EXECUTED ✓' : '> EXECUTE'}
              </button>
              {!selected && (
                <div className="text-cyan-800 text-[9px] tracking-wider mt-1 text-center">
                  SELECT A HABITATION TO ENABLE EXECUTION
                </div>
              )}
            </div>

            {/* Risk Metrics Widget */}
            <div className="border border-cyan-800/40 hud-panel hud-corners relative">
              <span className="corner-tr"></span>
              <span className="corner-bl"></span>

              <div className="flex items-center justify-between px-3 py-1.5 border-b border-cyan-900/40">
                <span className="text-cyan-700 text-[9px] tracking-[0.2em]">RISK_METRICS</span>
                <span className={`text-[9px] tracking-wider ${selected ? (selected.score >= 85 ? 'text-red-500' : 'text-amber-500') : 'text-cyan-800'}`}>
                  {selected ? `THREAT_LEVEL: ${selected.risk}` : 'NO_SELECTION'}
                </span>
              </div>

              <div className="px-4 py-4">
                {selected ? (
                  <div className="flex items-center gap-6">
                    <div className="flex-1 space-y-3">
                      <div>
                        <div className="text-cyan-700 text-[9px] tracking-[0.2em] mb-1">COMPOSITE RISK SCORE</div>
                        <div className={`text-3xl font-bold tracking-wider ${selected.score >= 85 ? 'text-red-400' : 'text-cyan-300'}`}>
                          {selected.score}%
                        </div>
                      </div>
                      <div className="space-y-1.5">
                        <div className="flex items-center justify-between">
                          <span className="text-cyan-700 text-[9px] tracking-wider">HAZARD_INT</span>
                          <div className="flex items-center gap-2">
                            <div className="w-20 h-1 bg-cyan-950 overflow-hidden">
                              <div className="h-full bg-cyan-500 transition-all duration-700" style={{ width: `${Math.min(selected.score + 5, 100)}%` }}></div>
                            </div>
                            <span className="text-cyan-500 text-[9px]">{Math.min(selected.score + 5, 100).toFixed(1)}</span>
                          </div>
                        </div>
                        <div className="flex items-center justify-between">
                          <span className="text-cyan-700 text-[9px] tracking-wider">VULN_POP</span>
                          <div className="flex items-center gap-2">
                            <div className="w-20 h-1 bg-cyan-950 overflow-hidden">
                              <div className="h-full bg-amber-500 transition-all duration-700" style={{ width: `${Math.max(selected.score - 12, 0)}%` }}></div>
                            </div>
                            <span className="text-amber-500 text-[9px]">{Math.max(selected.score - 12, 0).toFixed(1)}</span>
                          </div>
                        </div>
                        <div className="flex items-center justify-between">
                          <span className="text-cyan-700 text-[9px] tracking-wider">INFRA_DEF</span>
                          <div className="flex items-center gap-2">
                            <div className="w-20 h-1 bg-cyan-950 overflow-hidden">
                              <div className="h-full bg-red-500 transition-all duration-700" style={{ width: `${Math.min(selected.score + 3, 100)}%` }}></div>
                            </div>
                            <span className="text-red-500 text-[9px]">{Math.min(selected.score + 3, 100).toFixed(1)}</span>
                          </div>
                        </div>
                      </div>
                      <div className="text-cyan-800 text-[9px] tracking-wider pt-1 border-t border-cyan-900/30">
                        VECTOR: {selected.threatVector} | POP: {selected.pop.toLocaleString()}
                      </div>
                    </div>
                    <div className="shrink-0">
                      <DonutChart key={selected.id} score={selected.score} />
                    </div>
                  </div>
                ) : (
                  <div className="flex items-center justify-center py-6">
                    <div className="text-center">
                      <div className="text-cyan-800 text-[10px] tracking-[0.2em]">AWAITING TARGET SELECTION...</div>
                      <div className="text-cyan-900 text-[9px] tracking-wider mt-1">SELECT A HABITATION TO VIEW RISK ANALYSIS</div>
                    </div>
                  </div>
                )}
              </div>
            </div>

          </div>

          {/* Terminal footer */}
          <div className="px-3 py-1.5 border-t border-cyan-900/40 flex items-center justify-between text-[9px] text-cyan-800 tracking-wider">
            <span>SIH_26191</span>
            <span>ENGINE: RISK_ANALYZER_v2.4</span>
            <span>◆ READY</span>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════
       MAIN APP — State lifted here for
       two-way map ↔ terminal interactivity
       ═══════════════════════════════════════ */
    function App() {
      const [selectedId, setSelectedId] = useState(null);
      const [habitations, setHabitations] = useState(HABITATIONS);
      const [flyToTarget, setFlyToTarget] = useState(null);

      const selected = useMemo(
        () => habitations.find(h => h.id === selectedId) || null,
        [selectedId, habitations]
      );

      // Called when ANALYZE is clicked on a row — selects + flies map
      const handleAnalyze = useCallback((hab) => {
        const newId = hab.id === selectedId ? null : hab.id;
        setSelectedId(newId);
        if (newId !== null) {
          // Trigger a new flyTo by creating a fresh object reference
          setFlyToTarget({ id: hab.id, lat: hab.lat, lng: hab.lng, _ts: Date.now() });
        }
      }, [selectedId]);

      // Called when a marker is clicked on the map — selects only
      const handleMarkerSelect = useCallback((id) => {
        setSelectedId(prev => prev === id ? null : id);
      }, []);

      const handleRemove = useCallback((id) => {
        setHabitations(prev => prev.filter(h => h.id !== id));
        if (selectedId === id) setSelectedId(null);
      }, [selectedId]);

      return (
        <div className="h-screen w-screen bg-black font-mono flex flex-col text-cyan-400 overflow-hidden select-none">
          <StatusBar />

          <main className="flex-1 flex gap-2 p-2 overflow-hidden">
            {/* Left — Map (60%) */}
            <section className="w-[60%] shrink-0">
              <MapPanel
                habitations={habitations}
                selectedId={selectedId}
                onSelectHabitation={handleMarkerSelect}
                flyToTarget={flyToTarget}
              />
            </section>

            {/* Right — Terminal (40%) */}
            <section className="w-[40%] shrink-0">
              <CommandTerminal
                habitations={habitations}
                selectedId={selectedId}
                selected={selected}
                onAnalyze={handleAnalyze}
                onRemove={handleRemove}
              />
            </section>
          </main>

          <footer className="flex items-center justify-between px-4 py-1 border-t border-cyan-900/40 text-[8px] text-cyan-900 tracking-[0.2em]">
            <span>DRIP — DISASTER RELOCATION INTELLIGENCE PLATFORM © 2026</span>
            <span>BUILD 0.9.1-ALPHA</span>
            <span>NODE: PRIMARY | UPLINK: STABLE</span>
          </footer>
        </div>
      );
    }

    /* ── Mount ── */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
